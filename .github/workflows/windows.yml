name: Windows
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build-windows:
    name: "Build Windows installer"
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Apply VERSION
        shell: pwsh
        run: python scripts/set_version.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache Tauri CLI
        id: tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}
      - name: Install Tauri CLI
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        run: cargo tauri build --bundles nsis
      - name: Rename installer (drop version from filename)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Move-Item $exe.FullName "src-tauri/target/release/bundle/nsis/dayfile-setup.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/dayfile-setup.exe
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: src-tauri/target/release/bundle/nsis/dayfile-setup.exe
