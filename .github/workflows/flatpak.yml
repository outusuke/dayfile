name: Flatpak
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    name: "Build Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dayfile.flatpak
          manifest-path: dev.dayfile.app.yml
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-bundle
          path: dayfile.flatpak
  release:
    name: "Publish Release"
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: flatpak-bundle
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dayfile.flatpak
          generate_release_notes: true
          body: |
            Flatpak bundle for Dayfile

            **First install:**
            ```bash
            flatpak install --user dayfile.flatpak
            flatpak run dev.dayfile.app
            ```

            **Already installed? Update to this version:**
            ```bash
            flatpak install --user --reinstall dayfile.flatpak
            ```
