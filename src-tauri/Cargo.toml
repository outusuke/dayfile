[package]
name = "dayfile"
version = "1.0.0"
description = "A private, file-based daily journal"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lib]
name = "dayfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dayfile"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
