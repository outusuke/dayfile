[package]
name = "dayfile"
version = "1.0.0"
description = "A private, file-based daily journal"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[lib]
name = "dayfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dayfile"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
