<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dayfile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <header class="header">
        <div class="header-content">
          <div class="header-title">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <div>
              <h1>Dayfile</h1>
              <div class="header-subtitle">Auto-saves • Plain Markdown • ISO 8601</div>
            </div>
          </div>
          <nav class="tab-buttons" role="tablist">
            <button class="tab-btn active" data-tab="write" role="tab">Write</button>
            <button class="tab-btn" data-tab="browse" role="tab">Browse</button>
            <button class="tab-btn" data-tab="year" role="tab">Year</button>
          </nav>
        </div>
      </header>

      <div class="content">
        <div id="banner" class="setup-banner"></div>
        <div id="notice" class="notice hidden"></div>

        <!-- WRITE -->
        <section id="tab-write">
          <div class="write-grid">
            <div class="write-main">
              <div class="date-nav">
                <div class="date-selector">
                  <button class="nav-btn" id="prevDay" title="Previous day (Alt+←)">◀</button>
                  <div>
                    <input type="date" id="dateInput" class="date-input">
                    <div id="dateLabel" class="date-label"></div>
                  </div>
                  <button class="nav-btn" id="nextDay" title="Next day (Alt+→)">▶</button>
                </div>
                <div class="action-buttons">
                  <button class="btn btn-secondary" id="todayBtn">Today</button>
                  <button class="btn btn-secondary" id="starBtn" title="Star this entry" aria-pressed="false">☆</button>
                  <button class="btn btn-danger hidden" id="deleteBtn">🗑️ Delete</button>
                </div>
              </div>

              <div class="stats">
                <div class="stat-item"><div class="stat-value" id="statEntries">0</div><div class="stat-label">Total Entries</div></div>
                <div class="stat-item"><div class="stat-value" id="statStreak">0</div><div class="stat-label">Day Streak</div></div>
                <div class="stat-item"><div class="stat-value" id="statLongest">0</div><div class="stat-label">Longest Streak</div></div>
                <div class="stat-item"><div class="stat-value" id="statWords">0</div><div class="stat-label">Words Written</div></div>
              </div>

              <div class="editor-area">
                <div class="meta-row">
                  <div class="moods" id="moods" role="group" aria-label="Mood"></div>
                  <input type="text" id="tagsInput" class="tags-input" placeholder="tags, separated by commas" autocomplete="off" spellcheck="false">
                </div>
                <div class="editor-status">
                  <span id="wordCount" class="word-count"></span>
                  <span id="saveIndicator" class="save-indicator"></span>
                </div>
                <textarea id="entryText" class="textarea" placeholder="What's on your mind today?"></textarea>
              </div>
            </div>

            <aside class="write-side">
              <div class="calendar" id="calendar"></div>
            </aside>
          </div>
        </section>

        <!-- BROWSE -->
        <section id="tab-browse" class="hidden">
          <div class="browse-tools">
            <input type="search" id="searchInput" class="search-input" placeholder="Search entries, tags or dates…" autocomplete="off">
            <select id="tagFilter" class="select"><option value="">All tags</option></select>
            <button class="btn btn-secondary" id="starFilter" aria-pressed="false">★ Starred</button>
          </div>
          <div class="browse-meta">
            <span id="browseCount"></span>
            <span class="spacer"></span>
            <button class="btn btn-secondary" id="exportMd">Export Markdown</button>
            <button class="btn btn-secondary" id="exportJson">Export JSON</button>
          </div>
          <div id="filesList" class="file-list"></div>
        </section>

        <!-- YEAR -->
        <section id="tab-year" class="hidden">
          <div class="date-nav">
            <div class="date-selector">
              <button class="nav-btn" id="prevYear">◀</button>
              <div class="year-title" id="yearTitle"></div>
              <button class="nav-btn" id="nextYear">▶</button>
            </div>
            <div class="action-buttons">
              <button class="btn btn-secondary active" id="heatWords">Words</button>
              <button class="btn btn-secondary" id="heatMood">Mood</button>
            </div>
          </div>
          <div class="heat-wrap"><div id="heatmap" class="heatmap"></div></div>
          <div class="heat-legend" id="heatLegend"></div>
          <div class="heat-summary" id="heatSummary"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <dialog id="confirmDialog" class="dialog">
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="confirmNo">Cancel</button>
      <button class="btn btn-danger" id="confirmYes">OK</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
